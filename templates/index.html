<!DOCTYPE html>
<html>

<head>
    <title>BMI Calculator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>BMI Calculator</h1>

<form action="/calculate" method="POST">

<label>Weight in kilograms:</label>

<input
type="number"
step="0.01"
name="weight"
required>

<br><br>

<label>Height in meters:</label>

<input
type="number"
step="0.01"
name="height"
required>

<br><br>

<input
type="submit"
value="Calculate BMI">

</form>

</div>

</body>
</html>
